name: Auto Categorize Posts

on:
  push:
    paths:
      - '**.md'

jobs:
  categorize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Categorization Script
        run: python auto_categorize.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add investment.md crypto.md network.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update category post links" && git push)
