  <script>

    window.$docsify = {
      name: '🛡️ 詐騙觀察筆記',
      repo: '',

      plugins: [
        function(hook, vm) {
          // 左側側邊欄底部掛載 165 緊急通報
          hook.ready(function() {
            var sidebar = document.querySelector('.sidebar');
            if (sidebar && !document.querySelector('.sidebar-helper-card')) {
              var helperBox = document.createElement('div');

          // 文章閱讀數據統計 + 分享按鈕注入
          hook.afterEach(function(html, next) {
            // 首頁不注入文章資訊與分享按鈕
            if (vm.route.file !== 'README.md') {
              var headerRegex = /<h1[^>]*>([\s\S]*?)<\/h1>/i;

              // 構建純 HTML/SVG 社群分享組件

                    <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>

                  <a class="share-btn btn-x" href="https://twitter.com/intent/tweet?text=" onclick="this.href='https://twitter.com/intent/tweet?text=' + encodeURIComponent('${rawTitle} - 詐騙觀察筆記') + '&url=' + encodeURIComponent(window.location.href); return true;" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    X

                html = html.replace(match[0], blogHeaderHtml);
              }

              // 在文章最底部（上一篇/下一篇上方）再附加上分享條，方便讀者讀完後直接轉發
              html += `<div style="margin-top: 3rem; border-top: 1px dashed #e2e8f0; padding-top: 1.5rem;">${shareBarHtml}</div>`;
            }
            next(html);
          });

          // 頁面滾動進度條
          hook.doneEach(function() {
            var progressBar = document.getElementById('readingProgress');
            window.onscroll = function() {
              var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
              var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
              var scrolled = (height > 0) ? (winScroll / height) * 100 : 0;
              if (progressBar) {
                progressBar.style.width = scrolled + "%";
              }
            };
          });
        }
      ]
    };
  </script>
