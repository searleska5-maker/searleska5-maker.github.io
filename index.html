  <!-- 🚀 SEO 強制預載入區塊：Google 爬蟲專用 -->

      <p>專業拆解投資詐騙、假虛擬貨幣交易所、網路交友殺豬盤與海外求職騙局，提供第一時間受害自救與止付指南。</p>
    </noscript>
    <div style="text-align: center; padding: 60px 20px; color: #64748b;">
      <h2>🛡️ 詐騙觀察筆記載入中...</h2>
      <p>正在為您調取最新反詐安全情報</p>
    </div>
  </div>
  
  <script>
    window.$docsify = {
      name: '🛡️ 詐騙觀察筆記',
      repo: '',
      loadSidebar: true,
      auto2top: true,
      
      requestHeaders: {
        'cache-control': 'no-cache, no-store, must-revalidate',
        'pragma': 'no-cache'
      },

      search: {
        maxAge: 1800000,
        paths: 'auto',
        placeholder: '搜尋案例、黑平台、關鍵字...',
        noData: '找不到相關案例！',
        depth: 6,
        hideOtherSidebarContent: false
      },

      pagination: {
        previousText: '⬅ 上一篇案例',
        nextText: '下一篇案例 ➡',
        crossChapter: true,
        crossChapterText: true
      },

      plugins: [
        function(hook, vm) {
          // 文章閱讀數據統計與美化標頭
          hook.afterEach(function(html, next) {
            if (vm.route.file !== 'README.md') {
              var headerRegex = /<h1[^>]*>([\s\S]*?)<\/h1>/i;
              var match = html.match(headerRegex);

              if (match) {
                var rawTitle = match[1].replace(/<a[^>]*>.*?<\/a>/g, '').trim();
                var plainText = html.replace(/<[^>]+>/g, '').replace(/\s+/g, '');
                var charCount = plainText.length;
                var readMinutes = Math.max(1, Math.ceil(charCount / 350));
                
                var blogHeaderHtml = `
                  <div class="blog-post-header" style="margin-bottom:2rem;padding-bottom:1.2rem;border-bottom:2px solid #f1f5f9;">
                    <h1 style="font-size:2.1rem;font-weight:800;color:#0f172a;margin:0 0 10px 0;border:none;">${rawTitle}</h1>
                    <div style="display:flex;align-items:center;gap:12px;font-size:0.9rem;color:#64748b;">
                      <span style="background:#eff6ff;color:#2563eb;padding:3px 10px;border-radius:6px;font-weight:600;">專題剖析</span>
                      <span>•</span>
                      <span>約 ${charCount} 字</span>
                      <span>•</span>
                      <span>預計閱讀 ${readMinutes} 分鐘</span>
                    </div>
                  </div>
                `;
                html = html.replace(match[0], blogHeaderHtml);
              }
            }
            next(html);
          });

          // 頁面滾動進度條
          hook.doneEach(function() {
            var progressBar = document.getElementById('readingProgress');
            window.onscroll = function() {
              var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
              var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
              var scrolled = (height > 0) ? (winScroll / height) * 100 : 0;
              if (progressBar) {
                progressBar.style.width = scrolled + "%";
              }
            };
          });
        }
      ]
    };
  </script>

  <!-- 核心 Docsify JS 與必要外掛 -->
