<body>
  <div class="reading-progress-bar" id="readingProgress"></div>
  
  <div id="app">
    <div style="text-align: center; padding: 60px 20px; color: #64748b;">
      <h2>🛡️ 詐騙觀察筆記載入中...</h2>

  <script>
    window.copyPostLink = function() {
      navigator.clipboard.writeText(window.location.href).then(function() {
        var toast = document.createElement('div');
        toast.className = 'copy-toast';
        toast.innerText = '✅ 文章連結已複製到剪貼簿！';
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 2500);
      }).catch(function() {
        prompt('請手動複製以下文章網址：', window.location.href);
      });
    };

    window.$docsify = {
      name: '🛡️ 詐騙觀察筆記',
      repo: '',
      loadSidebar: true,
      auto2top: true,
      
      requestHeaders: {
        'cache-control': 'no-cache, no-store, must-revalidate',
        'pragma': 'no-cache'
      },

      pagination: {
        previousText: '⬅ 上一篇案例',
        nextText: '下一篇案例 ➡',
        crossChapter: true,
        crossChapterText: true
      },

      plugins: [
        function(hook, vm) {
          hook.ready(function() {
            var sidebar = document.querySelector('.sidebar');
            if (sidebar && !document.querySelector('.sidebar-helper-card')) {
              var helperBox = document.createElement('div');
              helperBox.className = 'sidebar-helper-card';
              helperBox.innerHTML = `
                <div class="title">🚨 緊急通報管道</div>
                <div class="desc">如遇詐騙請立即撥打 <b>165</b> 反詐騙諮詢專線，或至鄰近派出所報案圈存止付。</div>
              `;
              sidebar.appendChild(helperBox);
            }

            // 🚀 頂級優化：建立強效中文即時模糊搜尋引擎（支援輸入單個中文字立刻全域檢索）
            var searchDiv = document.querySelector('.sidebar .search');
            if (searchDiv && !document.getElementById('custom-search-results')) {
              var searchInput = searchDiv.querySelector('input');
              if (searchInput) {
                // 建立專屬下拉結果容器
                var resultsBox = document.createElement('div');
                resultsBox.id = 'custom-search-results';
                searchDiv.appendChild(resultsBox);

                // 本地文章資料庫索引（預先撈取站內主要案例）
                var siteIndex = [
                  { title: '別再相信保證獲利！sothebys國際取引所文政小判金詐騙最新受害者爆料：親歷 38,000 美金「能看不能領」的系統後台黑幕', url: '#/sothebys-wen-zheng-scam', category: '投資詐騙' },
                  { title: '📈 投資詐騙與黑平台專區', url: '#/investment', category: '分類導覽' },
                  { title: '🪙 加密貨幣黑幕專區', url: '#/crypto', category: '分類導覽' },
                  { title: '💬 網路交友與兼職專區', url: '#/network', category: '分類導覽' },
                  { title: '🛠️ 受害自救指南專區', url: '#/info', category: '分類導覽' }
                ];

                searchInput.addEventListener('input', function(e) {
                  var keyword = e.target.value.trim().toLowerCase();
                  if (keyword.length === 0) {
                    resultsBox.style.display = 'none';
                    resultsBox.innerHTML = '';
                    return;
                  }

                  // 進行模糊比對（只要輸入第一個字「別」、「詐」、「s」即可立刻命中）
                  var matched = siteIndex.filter(function(item) {
                    return item.title.toLowerCase().indexOf(keyword) !== -1 || item.category.toLowerCase().indexOf(keyword) !== -1;
                  });

                  if (matched.length > 0) {
                    var htmlContent = '';
                    matched.forEach(function(m) {
                      htmlContent += `
                        <div class="search-result-item" onclick="window.location.hash='${m.url.replace('#', '')}'; document.getElementById('custom-search-results').style.display='none';">
                          <div class="search-result-title">${m.title}</div>
                          <div class="search-result-snippet">分類：${m.category}</div>
                        </div>
                      `;
                    });
                    resultsBox.innerHTML = htmlContent;
                    resultsBox.style.display = 'block';
                  } else {
                    resultsBox.innerHTML = `<div style="padding: 12px; color: #64748b; font-size: 0.9rem; text-align: center;">找不到包含「${keyword}」的相關文章</div>`;
                    resultsBox.style.display = 'block';
                  }
                });

                // 點擊空白處自動關閉搜尋下拉框
                document.addEventListener('click', function(clickEvent) {
                  if (!searchDiv.contains(clickEvent.target)) {
                    resultsBox.style.display = 'none';
                  }
                });
              }
            }
          });

          hook.afterEach(function(html, next) {
            var isCategoryOrHome = vm.route.file === 'README.md' || 
                                   vm.route.file === 'investment.md' || 
                                   vm.route.file === 'crypto.md' || 
                                   vm.route.file === 'network.md' || 
                                   vm.route.file === 'info.md';

            if (!isCategoryOrHome) {
              var headerRegex = /<h1[^>]*>([\s\S]*?)<\/h1>/i;
              var match = html.match(headerRegex);

              var rawTitle = '';
              if (match) {
                rawTitle = match[1].replace(/<a[^>]*>.*?<\/a>/g, '').trim();
              } else {
                var fallbackMatch = html.match(/「([\s\S]*?)」/);
                rawTitle = fallbackMatch ? fallbackMatch[1].trim() : '案例深度調查與解析';
              }

              document.title = rawTitle + ' - 詐騙觀察筆記';

              var plainText = html.replace(/<[^>]+>/g, '').replace(/\s+/g, '');
              var charCount = plainText.length;
              var readMinutes = Math.max(1, Math.ceil(charCount / 350));
              
              var shareBarHtml = `
                <div class="article-share-bar">
                  <span class="share-label">分享防詐情報：</span>
                  <button class="share-btn btn-copy" onclick="window.copyPostLink()">複製連結</button>
                  <a class="share-btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=" onclick="this.href='https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href); return true;" target="_blank">Facebook</a>
                  <a class="share-btn btn-x" href="https://twitter.com/intent/tweet?text=" onclick="this.href='https://twitter.com/intent/tweet?text=' + encodeURIComponent('${rawTitle} - 詐騙觀察筆記') + '&url=' + encodeURIComponent(window.location.href); return true;" target="_blank">X</a>
                  <a class="share-btn btn-line" href="https://line.me/ti/p/y63jjVtNJe" target="_blank" rel="noopener noreferrer">LINE</a>
                </div>
              `;

              var blogHeaderHtml = `
                <div style="margin-bottom: 2.2rem; padding-bottom: 1.4rem; border-bottom: 2px solid #eef2f5;">
                  <h1 class="blog-post-title">${rawTitle}</h1>
                  <div style="display:flex; align-items:center; gap:12px; font-size:0.95rem; color:#64748b;">
                    <span style="background:#eff6ff; color:#2563eb; padding:4px 12px; border-radius:6px; font-weight:700;">專題剖析</span>
                    <span>•</span>
                    <span>約 ${charCount} 字</span>
                    <span>•</span>
                    <span>預計閱讀 ${readMinutes} 分鐘</span>
                  </div>
                </div>
                ${shareBarHtml}
              `;

              if (match) {
                html = html.replace(match[0], blogHeaderHtml);
              } else {
                html = blogHeaderHtml + html;
              }

              html += `<div style="margin-top: 3.5rem; border-top: 1.5px dashed #cbd5e1; padding-top: 2rem;">${shareBarHtml}</div>`;
            }
            next(html);
          });

          hook.doneEach(function() {
            var progressBar = document.getElementById('readingProgress');
            window.onscroll = function() {
              var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
              var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
              var scrolled = (height > 0) ? (winScroll / height) * 100 : 0;
              if (progressBar) {
                progressBar.style.width = scrolled + "%";
              }
            };
          });
        }
      ]
    };
  </script>
